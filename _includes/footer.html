<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-inner">
    <div class="footer-left">
      <a class="footer-substack" href="https://agamjn.substack.com" target="_blank" rel="noopener">Subscribe on Substack &#8599;</a>
      {%- if site.author.email -%}
        <a class="footer-email u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      {%- endif -%}
      {%- if site.minima.social_links -%}
        <span class="footer-social">{%- include social.html -%}</span>
      {%- endif -%}
    </div>

    {%- if site.description -%}
      <p class="footer-bio p-note">{{ site.description | escape }}</p>
    {%- endif -%}
  </div>
</footer>
